name: Scoring tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/biotracebench-dist"
      - name: Check published scoring files
        run: python -B scripts/check_distribution.py --dist "$RUNNER_TEMP/biotracebench-dist"
      - name: Install built wheel
        run: python -m pip install --no-deps "$RUNNER_TEMP"/biotracebench-dist/*.whl
      - name: Test installed scoring interface
        run: python -B -m unittest discover -s tests
      - name: Test source checkout
        run: PYTHONPATH=src python -B -m unittest discover -s tests
      - run: biotracebench-demo --out "$RUNNER_TEMP/biotracebench-demo"
