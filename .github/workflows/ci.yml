name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and packaging dependencies
        run: python -m pip install -e '.[test]' build
      - name: Check publication repository
        run: python scripts/check_repository.py
      - name: Run synthetic and mocked-provider tests
        env:
          PYTHONPATH: src:tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Check commands and synthetic demo
        run: |
          python scripts/demo.py --help
          python scripts/reproduce_paper.py --help
          python scripts/score_output.py --help
          python scripts/generate.py --help
          python scripts/demo.py --out "$RUNNER_TEMP/demo"
      - name: Build source archive
        run: python scripts/build_source.py --out "$RUNNER_TEMP/source-package"
      - name: Build wheel and source distribution
        run: python -m build --outdir "$RUNNER_TEMP/distributions"
